name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Pkl 0.32.1
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output /tmp/pkl \
            https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          printf '%s  %s\n' \
            3180b62da95c0cad1d904e9bb6c5f4a8f9032413c21e53194bb91ff1ee5f3211 \
            /tmp/pkl | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/pkl "$HOME/.local/bin/pkl"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run package gate
        run: scripts/gate.sh
